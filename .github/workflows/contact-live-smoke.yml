name: Public contact live smoke
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * 1'
permissions:
  contents: read
jobs:
  open-canada-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe current T3010 identification data for public phone contacts
        env:
          CONTACT_LIVE_SMOKE_ROWS: 5000
        run: node scripts/contact-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-live-smoke-manifest
          path: .tmp/contact-live-smoke/manifest.json
