name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: MCP protocol smoke
        shell: bash
        run: |
          PORT=3100 npm start > /tmp/clearing-house.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3100/healthz > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/health.json
          MCP_URL=http://127.0.0.1:3100/mcp node scripts/mcp-client-smoke.mjs
