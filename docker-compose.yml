services:
  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command:
      - start
      - --hostname=https://auth.clears.to
      - --http-enabled=true
      - --proxy-headers=xforwarded
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=60
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - wal_compression=on
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=1000
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearing_house
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearing_house"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./:/work:ro
    working_dir: /work
    command: >-
      sh -c 'for migration in db/migrations/*.sql; do
      echo "Applying $$migration";
      psql -h postgres -U postgres -d clearing_house -v ON_ERROR_STOP=1 -f "$$migration";
      done'
    restart: "no"

  schema-check:
    build: .
    command: npm run schema:check
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/clearing_house
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      schema-check:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment: &app-env
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/clearing_house
      T3010_YEAR: ${T3010_YEAR:-2024}
      T3010_DATA_DIR: /app/data/t3010/${T3010_YEAR:-2024}
      ENABLE_T3010_SYNC: ${ENABLE_T3010_SYNC:-1}
      T3010_SYNC_INTERVAL_HOURS: ${T3010_SYNC_INTERVAL_HOURS:-24}
      T3010_AUTO_RELOAD_SECONDS: ${T3010_AUTO_RELOAD_SECONDS:-300}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-1}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-10}
      AUTOMATION_LEASE_SECONDS: ${AUTOMATION_LEASE_SECONDS:-300}
      AUTOMATED_PORTFOLIOS_ENABLED: ${AUTOMATED_PORTFOLIOS_ENABLED:-0}
      ALLOCATION_POLICY_POLL_SECONDS: ${ALLOCATION_POLICY_POLL_SECONDS:-300}
      ALLOCATION_POLICY_BATCH_SIZE: ${ALLOCATION_POLICY_BATCH_SIZE:-10}
      ENABLE_WORKFLOW_WRITES: ${ENABLE_WORKFLOW_WRITES:-0}
      RECIPIENT_PORTAL_ENABLED: ${RECIPIENT_PORTAL_ENABLED:-0}
      RECIPIENT_PORTAL_BASE_URL: ${RECIPIENT_PORTAL_BASE_URL:-http://localhost:3001}
      RECIPIENT_PORTAL_PORT: 3001
      OFFER_TOKEN_TTL_HOURS: ${OFFER_TOKEN_TTL_HOURS:-168}
      WEBSITE_CONTACT_ENRICHMENT_ENABLED: ${WEBSITE_CONTACT_ENRICHMENT_ENABLED:-0}
      WEBSITE_CONTACT_TIMEOUT_MS: ${WEBSITE_CONTACT_TIMEOUT_MS:-5000}
      WEBSITE_CONTACT_MAX_PAGES: ${WEBSITE_CONTACT_MAX_PAGES:-4}
      WEBSITE_CONTACT_MAX_BYTES: ${WEBSITE_CONTACT_MAX_BYTES:-524288}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-disabled}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-25}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-30}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      CRA_STATUS_MAX_AGE_HOURS: ${CRA_STATUS_MAX_AGE_HOURS:-24}
      REQUIRE_SEPARATION_OF_DUTIES: ${REQUIRE_SEPARATION_OF_DUTIES:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-2555}
    volumes:
      - t3010-data:/app/data/t3010

  worker:
    build: .
    command: npm run ops:worker
    restart: unless-stopped
    depends_on:
      schema-check:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      AUTOMATION_WORKER_ID: ${AUTOMATION_WORKER_ID:-primary-worker}
    volumes:
      - t3010-data:/app/data/t3010

  recipient-portal:
    profiles: ["recipient-portal"]
    build: .
    command: npm run portal
    restart: unless-stopped
    depends_on:
      schema-check:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RECIPIENT_PORTAL_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      <<: *app-env
      RECIPIENT_PORTAL_ENABLED: "1"
      RECIPIENT_PORTAL_PORT: 3001

networks:
  default:
    name: clearing-house-backend
    driver: bridge

volumes:
  postgres-data:
  t3010-data:
  keycloak-postgres-data:
